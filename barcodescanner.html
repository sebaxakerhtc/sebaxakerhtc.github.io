<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканирай баркод</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { font-size: 22px; margin-bottom: 10px; color: #4fc3f7; }
        p { font-size: 14px; color: #aaa; margin-bottom: 20px; text-align: center; }
        #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.4); background: #1a1a1a; position: relative; }
        #reader video { border-radius: 12px 12px 0 0; width: 100% !important; }
        #reader__dashboard_section { background: #1a1a1a; border-radius: 0 0 12px 12px; }
        #reader__dashboard_section button { background: #4fc3f7; border: none; color: #000; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 8px; }
        #reader__dashboard_section button:hover { background: #29b6f6; }
        #reader__scan_region img { display: none; }
        /* Анимация на сканиращата линия */
        #reader__scan_region::after {
            content: '';
            position: absolute;
            left: 4%; right: 4%; height: 3px;
            background: linear-gradient(90deg, rgba(79,195,247,0), #4fc3f7, rgba(79,195,247,0));
            animation: scanline 2.2s ease-in-out infinite;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes scanline {
            0% { top: 6%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 92%; opacity: 0; }
        }
        .status { margin-top: 20px; font-size: 14px; color: #888; text-align: center; min-height: 18px; }
        .result { margin-top: 16px; background: #1a1a1a; padding: 16px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        .result .code { font-size: 24px; font-weight: 700; color: #4fc3f7; word-break: break-all; }
        .result .label { font-size: 12px; color: #888; margin-top: 4px; }
        .hidden { display: none !important; }
        .btn { margin-top: 12px; background: transparent; border: 1px solid #555; color: #aaa; padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; max-width: 400px; }
        .btn:hover { border-color: #888; color: #fff; }
        .btn-torch {
            margin-top: 12px;
            background: transparent;
            border: 1px solid #ffa726;
            color: #ffa726;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }
        .btn-torch:hover { background: rgba(255,167,38,0.12); }
    </style>
</head>
<body>
    <h1>📷 Сканирай баркод</h1>
    <p>EAN-8 / EAN-13 — насочете камерата към баркода</p>

    <div id="reader"></div>
    <button id="torchBtn" class="btn-torch hidden" onclick="toggleTorch()">🔦 Фонът</button>
    <div class="status" id="status">Камерата се зарежда...</div>

    <div id="resultContainer" class="result hidden">
        <div class="label">✅ Открит баркод (валидиран EAN)</div>
        <div class="code" id="barcodeResult"></div>
        <div id="sendStatus" style="margin-top:12px; font-size:14px;"></div>
    </div>

    <button id="rescanBtn" class="btn hidden" onclick="restartScanner()">🔄 Сканирай отново</button>

    <script>
        const BOT_USERNAME = 'bolero_alexbot';
        let html5QrCode = null;
        let lastBarcode = '';
        let isTelegram = false;
        let dataSent = false;
        let torchOn = false;
        let statusTimer = null;

        // Инициализация Telegram WebApp
        try {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                isTelegram = true;
                console.log('Telegram WebApp OK');
            }
        } catch(e) {
            console.log('Извън Telegram');
        }

        /**
         * Проверка на контролната сума на EAN-8 и EAN-13.
         * Отхвърля грешно разчетените кодове още преди изпращане в бота.
         */
        function isValidEan(code) {
            if (typeof code !== 'string') return false;
            if (!/^\d{8}$|^\d{13}$/.test(code)) return false;
            const check = Number(code[code.length - 1]);
            const body = code.slice(0, -1);
            let sum = 0;
            for (let i = 0; i < body.length; i++) {
                // EAN-13 (12-цифрено тяло): тегла 1,3,1,3...
                // EAN-8  (7-цифрено тяло):  тегла 3,1,3,1...
                const weight = (body.length === 12)
                    ? (i % 2 === 0 ? 1 : 3)
                    : (i % 2 === 0 ? 3 : 1);
                sum += Number(body[i]) * weight;
            }
            const expected = (10 - (sum % 10)) % 10;
            return check === expected;
        }

        function startScanner() {
            const status = document.getElementById('status');
            document.getElementById('torchBtn').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    // Широк и нисък бокс — оптимизиран за 1D (EAN) баркодове
                    qrbox: { width: 340, height: 130 },
                    aspectRatio: 1.0,
                    // Само EAN-8 / EAN-13 → по-бързо и без грешни разпознавания
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8
                    ],
                    // ⭐ Нативният BarcodeDetector (Android/Chrome) е по-точен от ZXing
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    },
                    // ВАЖНО: facingMode трябва да е тук, иначе config.videoConstraints
                    // напълно заменя constraints-а от първия аргумент на start()
                    videoConstraints: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                },
                onScanSuccess,
                onScanFailure
            ).then(() => {
                status.textContent = '✅ Камерата работи. Насочете към баркод.';
            }).catch(err => {
                status.textContent = '❌ Грешка с камерата: ' + err;
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (dataSent || !decodedText) return;

            // Грешно разчетен код (лош фокус/светлина) → игнорираме, не спираме камерата
            if (!isValidEan(decodedText)) {
                const status = document.getElementById('status');
                status.textContent = '⚠️ Невалиден EAN — задръжте камерата стабилно...';
                clearTimeout(statusTimer);
                statusTimer = setTimeout(() => {
                    if (!dataSent) {
                        status.textContent = '✅ Камерата работи. Насочете към баркод.';
                    }
                }, 1200);
                return;
            }

            if (decodedText !== lastBarcode) {
                lastBarcode = decodedText;
                html5QrCode.pause();

                document.getElementById('reader').classList.add('hidden');
                document.getElementById('torchBtn').classList.add('hidden');
                document.getElementById('status').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('barcodeResult').textContent = decodedText;

                sendBarcode(decodedText);
            }
        }

        function onScanFailure(error) { /* ignore */ }

        /**
         * Изпращане само чрез deep link — доказано работещ механизъм.
         * sendData() е премахнат: той затваряше WebApp-а преди да се отвори deep link-ът.
         */
        function sendBarcode(barcode) {
            const sendStatus = document.getElementById('sendStatus');
            dataSent = true;

            sendStatus.innerHTML = '📤 Изпращане чрез Telegram...';
            sendStatus.style.color = '#fff';
            document.getElementById('rescanBtn').classList.remove('hidden');

            const deepLink = `https://t.me/${BOT_USERNAME}?start=${barcode}`;
            window.location.href = deepLink;

            // Ако по някаква причина навигацията не се осъществи — затваряме WebApp-а
            setTimeout(() => {
                try {
                    if (isTelegram) Telegram.WebApp.close();
                } catch(e) {}
            }, 1200);
        }

        async function toggleTorch() {
            const torchBtn = document.getElementById('torchBtn');
            if (!html5QrCode || !html5QrCode.isScanning || dataSent) return;
            torchOn = !torchOn;
            try {
                // Android/Chrome: { advanced: [{ torch }] }; fallback: { torch }
                try {
                    await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
                } catch (e) {
                    await html5QrCode.applyVideoConstraints({ torch: torchOn });
                }
                torchBtn.textContent = torchOn ? '🔦 Фонът: ВКЛ' : '🔦 Фонът';
            } catch (e) {
                // Устройството не поддържа фенерче
                torchOn = !torchOn;
                torchBtn.textContent = '🔦 Не се поддържа';
                setTimeout(() => { torchBtn.textContent = '🔦 Фонът'; }, 1500);
            }
        }

        /**
         * Пълен рестарт на камерата (stop → start), вместо resume(),
         * който не се възстановява след пауза/превключване на приложението.
         */
        function restartScanner() {
            dataSent = false;
            lastBarcode = '';
            torchOn = false;
            document.getElementById('torchBtn').textContent = '🔦 Фонът';
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('rescanBtn').classList.add('hidden');
            document.getElementById('reader').classList.remove('hidden');
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('status').textContent = 'Камерата се зарежда...';

            if (html5QrCode) {
                const old = html5QrCode;
                html5QrCode = null;
                Promise.resolve()
                    .then(() => old.stop())
                    .catch(() => {})
                    .then(() => { try { old.clear(); } catch (e) {} })
                    .then(() => startScanner());
            } else {
                startScanner();
            }
        }

        window.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
